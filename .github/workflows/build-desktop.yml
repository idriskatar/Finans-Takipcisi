name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # WiX/MSI derlemesi Windows-1252 kod sayfası nedeniyle Türkçe karakterlerde
          # başarısız oluyor (LGHT0311); bu yüzden CI'da yalnızca NSIS üretiliyor.
          - name: Windows (NSIS)
            os: windows-latest
            args: '--bundles nsis'
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: '--bundles dmg --target aarch64-apple-darwin'
          - name: macOS (Intel)
            os: macos-latest
            args: '--bundles dmg --target x86_64-apple-darwin'
          - name: Linux (AppImage + deb)
            os: ubuntu-22.04
            args: '--bundles appimage,deb'
    permissions:
      contents: write

    steps:
      - name: Kaynak kod
        uses: actions/checkout@v4

      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Derle ve sürüm yayınla
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Finans Takipçisi v__VERSION__'
          releaseBody: |
            Finans Takipçisi — çok platformlu masaüstü uygulaması.
            Geliştirici: İdris KATAR · Lisans: MIT
            Mobil paketler ayrı workflow'larda üretilir (Actions > Artifacts).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Çapraz derlemede çıktı target/<triple>/release/bundle/ altına gider;
      # recursive glob hem o yolu hem normal yolu kapsar.
      - name: Paketleri Actions Artifacts olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ strategy.job-index }}
          path: |
            desktop/src-tauri/target/**/bundle/**/*.exe
            desktop/src-tauri/target/**/bundle/**/*.dmg
            desktop/src-tauri/target/**/bundle/**/*.AppImage
            desktop/src-tauri/target/**/bundle/**/*.deb
            desktop/src-tauri/target/**/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/bundle/**/*.app
          if-no-files-found: warn
