name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # WiX 3, CP-1252 kod sayfasında Türkçe karakterleri kodlayamadığı için MSI yapılmaz.
          - name: Windows (NSIS)
            os: windows-latest
            args: '--bundles nsis'
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: '--bundles dmg --target aarch64-apple-darwin'
          - name: macOS (Intel)
            os: macos-latest
            args: '--bundles dmg --target x86_64-apple-darwin'
          - name: Linux (AppImage + deb)
            os: ubuntu-22.04
            args: '--bundles appimage,deb'

    steps:
      - name: Kaynak kod
        uses: actions/checkout@v4

      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust araç zinciri
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # tagName/releaseName verilmezse action yalnızca derler; kendi artifact
      # araması yapılmaz ("No artifacts were found" hatası ortaya çıkmaz).
      - name: Derle
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: finans
        with:
          projectPath: desktop/src-tauri
          args: ${{ matrix.args }}

      - name: Paketleri Actions Artifacts olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ strategy.job-index }}
          path: |
            desktop/src-tauri/target/**/bundle/**/*.exe
            desktop/src-tauri/target/**/bundle/**/*.dmg
            desktop/src-tauri/target/**/bundle/**/*.AppImage
            desktop/src-tauri/target/**/bundle/**/*.deb
            desktop/src-tauri/target/**/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/bundle/**/*.app
          if-no-files-found: error

  release:
    name: GitHub Release (taslak)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kaynak kod (script için)
        uses: actions/checkout@v4

      - name: Artifact'leri indir
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: latest.json üret (updater)
        run: node scripts/generate-latest.mjs artifacts "${GITHUB_REF_NAME#v}" "${GITHUB_REF_NAME}"

      - name: Taslak sürüm oluştur ve paketleri ekle
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Finans Takipçisi ${{ github.ref_name }}
          body: |
            Finans Takipçisi — çok platformlu masaüstü uygulaması.
            Geliştirici: İdris KATAR · Lisans: MIT
            Mobil paketler Build Mobile workflow'undaki Artifacts'tadır.
          files: artifacts/**
