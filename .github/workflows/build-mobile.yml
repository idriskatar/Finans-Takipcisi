name: Build Mobile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kaynak kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK ortamı (runner'da hazır)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || { echo "Android SDK bulunamadı"; exit 1; }

      - name: Android SDK lisanslarını kabul et
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Rust araç zinciri (Android hedefleri)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target

      - name: Android projesini başlat
        working-directory: mobile/src-tauri
        env:
          CI: 'true'
        run: cargo tauri android init --ci

      - name: Android derle (APK)
        working-directory: mobile/src-tauri
        run: cargo tauri android build --apk

      # Android, imzasız APK'yı yüklemeyi reddeder. CI'da geçici bir debug anahtarı
      # üretip APK'yı bununla imzalıyoruz (secret gerekmez, telefon kurulumu çalışır).
      - name: Debug anahtarı üret ve APK'yı imzala
        shell: bash
        run: |
          set -e
          KEYSTORE="$RUNNER_TEMP/finans-debug.jks"
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Finans Takipcisi,C=TR" >/dev/null 2>&1

          UNSIGNED=$(find mobile/src-tauri/gen/android/app/build/outputs -name '*unsigned*.apk' | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "İmzalanmamış APK bulunamadı"; exit 1
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          OUT="mobile/src-tauri/gen/android/app/build/outputs/Finans-Takipcisi-Android.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$OUT" "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$OUT"
          echo "İmzalı APK: $OUT"

      - name: Kurulabilir APK yükleniyor
        uses: actions/upload-artifact@v4
        with:
          name: android-install-apk
          path: mobile/src-tauri/gen/android/app/build/outputs/Finans-Takipcisi-Android.apk
          if-no-files-found: error

      - name: APK'yi GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: mobile/src-tauri/gen/android/app/build/outputs/Finans-Takipcisi-Android.apk

  ios:
    name: iOS (simulator .app, imzasız)
    runs-on: macos-latest
    steps:
      - name: Kaynak kod
        uses: actions/checkout@v4

      - name: Xcode seç
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Rust araç zinciri (iOS hedefleri)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios

      - name: Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target

      - name: iOS projesini başlat
        working-directory: mobile/src-tauri
        env:
          CI: 'true'
        run: cargo tauri ios init --ci

      # Apple Developer Team ID / sertifika olmadığı için cihaz/IPA imzalanamaz.
      # Simulator hedefi imza gerektirmez; derlemenin doğrulanması için kullanılır.
      - name: iOS simulator derle (imzasız)
        working-directory: mobile/src-tauri
        env:
          CI: 'true'
        run: cargo tauri ios build --target aarch64-sim --ci

      - name: .app yükleniyor
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: |
            mobile/src-tauri/gen/apple/**
            mobile/src-tauri/target/**/*.app
          if-no-files-found: warn
